{{- if .Values.keycloak.defaultConfig }}
apiVersion: "external-secrets.io/v1"
kind: ExternalSecret
metadata:
  name: keycloak-users
  namespace: {{ .Release.Namespace }}
  {{- if .Values.externalSecrets.keycloakUsers.metadata }}
  {{- toYaml .Values.externalSecrets.keycloakUsers.metadata | nindent 2 }}
  {{- end }}
spec:
  {{ include "keycloak.externalSecrets.lifecycle" (dict "local" .Values.externalSecrets.keycloakUsers "global" .Values.global) | nindent 2 }}
  secretStoreRef:
    name: {{ .Values.global.secretStore.name }}
    kind: {{ .Values.global.secretStore.kind }}
  target:
    name: keycloak-users
    {{ include "keycloak.externalSecrets.targetLifecycle" (dict "local" .Values.externalSecrets.keycloakUsers "global" .Values.global) | nindent 4 }}
    template:
      {{- if .Values.externalSecrets.keycloakUsers.targetMetadata }}
      metadata:
        {{- toYaml .Values.externalSecrets.keycloakUsers.targetMetadata | nindent 8 }}
      {{- end }}
      type: Opaque
      data:
        qtodo-admin-password: "{{ `{{ .qtodo_admin_password }}` }}"
        qtodo-user1-password: "{{ `{{ .qtodo_user1_password }}` }}"
        rhtas-user-password: "{{ `{{ .rhtas_user_password }}` }}"
        rhtpa-user-password: "{{ `{{ .rhtpa_user_password }}` }}"
        acs-admin-password: "{{ `{{ .acs_admin_password }}` }}"
  data:
  - secretKey: qtodo_admin_password
    remoteRef:
      key: {{ .Values.keycloak.users.passwordVaultKey }}
      property: qtodo-admin-password
  - secretKey: qtodo_user1_password
    remoteRef:
      key: {{ .Values.keycloak.users.passwordVaultKey }}
      property: qtodo-user1-password
  - secretKey: rhtas_user_password
    remoteRef:
      key: {{ .Values.keycloak.users.passwordVaultKey }}
      property: rhtas-user-password
  - secretKey: rhtpa_user_password
    remoteRef:
      key: {{ .Values.keycloak.users.passwordVaultKey }}
      property: rhtpa-user-password
  - secretKey: acs_admin_password
    remoteRef:
      key: secret/data/hub/infra/acs/acs-central
      property: admin-password
{{- end }}
