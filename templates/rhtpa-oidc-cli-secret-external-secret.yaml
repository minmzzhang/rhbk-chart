{{- if .Values.keycloak.defaultConfig }}
---
apiVersion: "external-secrets.io/v1"
kind: ExternalSecret
metadata:
  name: rhtpa-oidc-cli-secret
  namespace: {{ .Release.Namespace }}
  {{- if .Values.externalSecrets.rhtpa.metadata }}
  {{- toYaml .Values.externalSecrets.rhtpa.metadata | nindent 2 }}
  {{- end }}
spec:
  {{ include "keycloak.externalSecrets.lifecycle" (dict "local" .Values.externalSecrets.rhtpa "global" .Values.global) | nindent 2 }}
  secretStoreRef:
    name: {{ .Values.global.secretStore.name }}
    kind: {{ .Values.global.secretStore.kind }}
  target:
    name: rhtpa-oidc-cli-secret
    {{ include "keycloak.externalSecrets.targetLifecycle" (dict "local" .Values.externalSecrets.rhtpa "global" .Values.global) | nindent 4 }}
    template:
      {{- if .Values.externalSecrets.rhtpa.targetMetadata }}
      metadata:
        {{- toYaml .Values.externalSecrets.rhtpa.targetMetadata | nindent 8 }}
      {{- end }}
      type: Opaque
      data:
        client-secret: "{{ `{{ .client_secret | trim }}` }}"
  data:
  - secretKey: client_secret
    remoteRef:
      key: {{ .Values.keycloak.oidcSecrets.rhtpaCli.vaultPath }}
      property: client-secret
{{- end }}

